<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guha Cloud</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <canvas id="bgCanvas"></canvas>
  <div class="landing-container">
    <div class="landing-card">
      <div class="logo-animation">
        <svg class="cloud-svg" viewBox="0 0 100 80" width="80" height="64">
          <defs>
            <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#6366f1"/>
              <stop offset="100%" stop-color="#a855f7"/>
            </linearGradient>
          </defs>
          <path d="M25 60 Q15 60 15 50 Q15 40 25 40 Q20 32 32 28 Q42 24 52 24 Q62 24 72 28 Q82 32 77 40 Q87 40 87 50 Q87 60 77 60 Z" fill="none" stroke="url(#cloudGrad)" stroke-width="2.5"/>
          <path d="M25 60 Q15 60 15 50 Q15 40 25 40 Q20 32 32 28 Q42 24 52 24 Q62 24 72 28 Q82 32 77 40 Q87 40 87 50 Q87 60 77 60 Z" fill="url(#cloudGrad)" opacity="0.08"/>
        </svg>
      </div>
      <h1>Guha Cloud</h1>
      <p class="subtitle">Personal cloud storage. Powered by Supabase &amp; Backblaze B2.</p>
      <div class="landing-actions">
        <a href="/login" class="btn btn-primary btn-lg">
          <span>Sign In</span>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
            <polyline points="10 17 15 12 10 7"/>
          </svg>
        </a>
      </div>
      <div class="tech-badges">
        <span class="tech-badge supabase"><svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M11.9 22.3c-.4.4-.9.4-1.2.1-.3-.3-.2-.8.1-1.2l4.5-5.5c.4-.5.1-1.3-.6-1.3H9.5c-.6 0-1.1-.3-1.3-.8s-.1-1.1.2-1.5l5.5-6.5c.4-.4.9-.4 1.2-.1.3.3.2.8-.1 1.2l-4.5 5.5c-.4.5-.1 1.3.6 1.3h5.6c.6 0 1.1.3 1.3.8s.1 1.1-.2 1.5l-5.5 6.5z"/></svg> Supabase</span>
        <span class="tech-badge b2"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg> Backblaze B2</span>
      </div>
      <div class="attribution">Inspired idea from <a href="https://haricloud.tech" target="_blank" rel="noopener">haricloud.tech</a></div>
    </div>
  </div>
  <script>
    const canvas = document.getElementById('bgCanvas');
    const ctx = canvas.getContext('2d');
    let particles = [];
    let time = 0;

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    class Particle {
      constructor() { this.reset(); }
      reset() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 2.5 + 0.5;
        this.speedX = (Math.random() - 0.5) * 0.3;
        this.speedY = (Math.random() - 0.5) * 0.3;
        this.opacity = Math.random() * 0.4 + 0.05;
        this.hue = Math.random() < 0.5 ? 240 : 280;
      }
      update() {
        this.x += this.speedX;
        this.y += this.speedY;
        if (this.x < -10 || this.x > canvas.width + 10 || this.y < -10 || this.y > canvas.height + 10) this.reset();
      }
      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fillStyle = `hsla(${this.hue}, 60%, 60%, ${this.opacity})`;
        ctx.fill();
      }
    }

    for (let i = 0; i < 60; i++) particles.push(new Particle());

    function drawGradientMesh() {
      const grd = ctx.createRadialGradient(canvas.width * 0.5, canvas.height * 0.5, 0, canvas.width * 0.5, canvas.height * 0.5, canvas.width * 0.7);
      grd.addColorStop(0, 'rgba(99,102,241,0.04)');
      grd.addColorStop(0.4, 'rgba(168,85,247,0.02)');
      grd.addColorStop(1, 'transparent');
      ctx.fillStyle = grd;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      for (let i = 0; i < 3; i++) {
        const cx = canvas.width * (0.2 + Math.sin(time * 0.0003 + i * 2) * 0.3);
        const cy = canvas.height * (0.3 + Math.cos(time * 0.0004 + i * 2) * 0.3);
        const r = canvas.width * 0.4;
        const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
        g.addColorStop(0, `hsla(${240 + i * 20}, 50%, 60%, 0.02)`);
        g.addColorStop(1, 'transparent');
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }
    }

    function animate() {
      time++;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = 'var(--bg)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      drawGradientMesh();

      particles.forEach(p => { p.update(); p.draw(); });

      for (let i = 0; i < particles.length; i++) {
        for (let j = i + 1; j < particles.length; j++) {
          const dx = particles[i].x - particles[j].x;
          const dy = particles[i].y - particles[j].y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < 100) {
            ctx.beginPath();
            ctx.moveTo(particles[i].x, particles[i].y);
            ctx.lineTo(particles[j].x, particles[j].y);
            ctx.strokeStyle = `hsla(240, 50%, 60%, ${0.04 * (1 - dist / 100)})`;
            ctx.lineWidth = 0.5;
            ctx.stroke();
          }
        }
      }
      requestAnimationFrame(animate);
    }
    animate();
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</body>
</html>
